<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Combo Lab</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* a cockpit: knobs on the left, the 150 tickets (or the grid) in the middle, the read-outs on the right */
:root{
  --bg:#f2f4f1; --panel:#ffffff; --ink:#18201b; --muted:#5b685f; --line:#d8ded8; --chip:#edf1ed;
  --accent:#1f7a4d; --accent-ink:#ffffff; --warn:#a85f12; --bad:#b3362c; --good:#1f7a4d;
  --qb:#3b5bdb; --rb:#2b8a3e; --wr:#c2410c; --te:#7048e8; --dst:#495057;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1512;--panel:#161e19;--ink:#e6ece7;--muted:#9aa89f;--line:#2a352e;--chip:#1e2822;--accent:#3fb37a;--accent-ink:#06130c;--warn:#e09a4d;--bad:#ef6a5e;--good:#3fb37a;--qb:#748ffc;--rb:#51cf66;--wr:#ff8a4c;--te:#9775fa;--dst:#adb5bd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--panel:#161e19;--ink:#e6ece7;--muted:#9aa89f;--line:#2a352e;--chip:#1e2822;--accent:#3fb37a;--accent-ink:#06130c;--warn:#e09a4d;--bad:#ef6a5e;--good:#3fb37a;--qb:#748ffc;--rb:#51cf66;--wr:#ff8a4c;--te:#9775fa;--dst:#adb5bd;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);padding:10px 16px 24px}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:15px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);padding:6px 11px;font:600 13px var(--body);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,td[data-q]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.truth{display:inline-flex;gap:8px;align-items:center;padding:5px 10px;border-radius:6px;border:1px dashed var(--warn);color:var(--warn);font-weight:600;cursor:pointer}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 400px;gap:12px;align-items:start}
@media (max-width:1240px){.layout{grid-template-columns:230px minmax(0,1fr)} .side{grid-column:1/-1}}
@media (max-width:780px){.layout{grid-template-columns:minmax(0,1fr)} .layout>main{order:-1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.knob{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:10px 0}
.knob label{font-weight:600;font-size:13px}
.knob output{font:12px var(--mono);color:var(--muted)}
.knob input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.knob small{grid-column:1/-1;color:var(--muted);font-size:11.5px;line-height:1.3}
.rule{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;align-items:start;margin:8px 0;cursor:pointer}
.rule input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.rule span{font-weight:600;font-size:13px}
.rule small{grid-column:2;color:var(--muted);font-size:11.5px;line-height:1.3}
.rule.off span{color:var(--warn)}
.rulecheck{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin:4px 0 10px}
.rulecheck b{font-family:var(--mono)}
.rulecheck .hit{color:var(--warn);font-weight:600}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0 10px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 10px;border-radius:6px;font:600 13px var(--body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:2px 8px;font-size:12px}
.views{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.views button,.tabs button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 10px;border-radius:5px;font:600 12.5px var(--body);cursor:pointer}
.views button[aria-selected="true"],.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:8px}
.replay{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.replay input[type=range]{width:170px;accent-color:var(--accent)}
.stat{font:12px var(--mono);color:var(--muted)}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 8px;border:1px dashed var(--accent);border-radius:6px;margin-bottom:8px;font-size:13px}
.board{max-height:74vh;overflow:auto;border:1px solid var(--line);border-radius:6px}
.tk{display:grid;grid-template-columns:36px minmax(0,1fr) 62px 78px;gap:6px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
.tk:nth-child(even){background:color-mix(in srgb,var(--chip) 55%,transparent)}
.tk.new{animation:pop .6s ease-out} @keyframes pop{from{background:color-mix(in srgb,var(--accent) 32%,transparent)}}
@media (prefers-reduced-motion:reduce){.tk.new{animation:none}}
.tk .no{font:11px var(--mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:4px;background:var(--chip);border-left:3px solid var(--dst);cursor:pointer;white-space:nowrap;font-size:12px}
.chip.sel{outline:2px solid var(--ink);outline-offset:1px}
.chip b{font-weight:600}
.chip i{font-style:normal;font:10.5px var(--mono);color:var(--muted)}
.p-QB{border-left-color:var(--qb)} .p-RB{border-left-color:var(--rb)} .p-WR{border-left-color:var(--wr)} .p-TE{border-left-color:var(--te)} .p-DST{border-left-color:var(--dst)}
.tag{display:inline-block;font:600 10px var(--mono);padding:0 3px;border-radius:3px}
.t-soft{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)} .t-tough{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.t-val{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)} .t-stud{background:color-mix(in srgb,var(--qb) 20%,transparent);color:var(--qb)}
.t-q{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tablewrap{max-height:68vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;z-index:1;background:var(--panel);font:600 11px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
th[data-s]{cursor:pointer}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr.click{cursor:pointer} tr.click:hover td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.bar{height:6px;border-radius:3px;background:var(--accent);opacity:.75}
.flag{color:var(--bad);font-weight:700}
.note{color:var(--muted);font-size:12px;margin:6px 0;line-height:1.4}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:10px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.kpi span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi b{font:600 18px var(--mono)}
.hidden-truth{color:var(--muted);font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11.5px;color:var(--muted);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
table.grid{width:auto}
table.grid th.gc{text-align:center;line-height:1.15;font:600 10.5px var(--mono);letter-spacing:0;text-transform:none;padding:4px 2px;min-width:30px}
table.grid th.gc i{font-style:normal;color:var(--muted);font-weight:400}
table.grid td.gc{text-align:center;font:11.5px var(--mono);padding:4px 2px;min-width:30px;cursor:pointer;border-left:1px solid var(--line)}
table.grid td.gc.own{box-shadow:inset 0 0 0 1px var(--qb)}
table.grid td.gc.miss{box-shadow:inset 0 0 0 2px var(--bad)}
table.grid tr.sum td{font-weight:600;border-top:2px solid var(--line)}
table.grid td.diag{font-weight:700;box-shadow:inset 0 0 0 1px var(--ink)}
.rowlab{font-size:12px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <h1>Combo Lab</h1>
  <div class="seg" id="weeks" role="group" aria-label="Week"></div>
  <div class="seg" id="books" role="group" aria-label="Which book">
    <button data-b="mine" aria-pressed="true">My knobs</button><button data-b="v13">V13 combiner</button><button data-b="r2">V10 + rules (Week 6 build)</button>
  </div>
  <label class="truth"><input type="checkbox" id="truth"> Truth layer (after the games)</label>
  <div class="seg" id="color" role="group" aria-label="Colour the chips by">
    <button data-c="pos" aria-pressed="true">Position</button><button data-c="own">Chalk</button><button data-c="weak">Weak spot</button><button data-c="boom">Boom</button><button data-c="pts">Points</button>
  </div>
</header>

<div class="layout">
  <aside class="panel" id="knobs">
    <h2>Knobs</h2>
    <p class="note">Each move rebuilds the 150 live, from pre-game data only. Every ticket is a QB with one or two of his stack receivers, $49,500 to $50,000.</p>
    <div id="knoblist"></div>
    <hr class="sep">
    <h2>Your rules</h2>
    <p class="note">Switch one off and the 150 rebuild without it. Results shows how many tickets use the freedom.</p>
    <div id="rulelist"></div>
    <div class="btnrow"><button class="btn" id="reset">Reset knobs</button><button class="btn" id="copyk">Copy settings</button></div>
    <p class="note" id="copied"></p>
  </aside>

  <main class="panel">
    <div class="views" id="views" role="tablist" aria-label="Main view">
      <button data-v="tickets" aria-selected="true">Tickets</button><button data-v="grid">QB × game grid</button><button data-v="matrix">Game matrix</button>
    </div>
    <div class="board-head">
      <div class="replay">
        <button class="btn primary" id="play">Play the fill</button>
        <input type="range" id="scrub" min="0" max="150" value="150" step="1" aria-label="Tickets filled so far">
        <span class="stat" id="scrubv">150 / 150</span>
        <label class="stat">speed <select id="speed"><option value="260">slow</option><option value="90" selected>normal</option><option value="25">fast</option></select></label>
      </div>
      <div class="stat" id="boardstat"></div>
    </div>
    <div id="filterbar"></div>
    <div id="view"></div>
  </main>

  <section class="panel side">
    <div class="tabs" id="tabs" role="tablist" aria-label="Read-outs">
      <button data-t="results" aria-selected="true">Results</button><button data-t="players">Players</button><button data-t="stacks">QB stacks</button><button data-t="games">Games</button><button data-t="pairs">Pairs</button><button data-t="missed">Missed pairs</button>
    </div>
    <div id="tabbody"></div>
  </section>
</div>

    const pc = pairCounts(B, n), key = (x, y) => Math.min(x, y) + "|" + Math.max(x, y);
    const syn = [];   // PRE-GAME: same-game pairs the lift table says boom together, weighted by both boom chances
    for (let x = 0; x < P.length; x++) for (let y = x + 1; y < P.length; y++) { const a = P[x], b = P[y];
      if (!a.role || !b.role || a.p === "DST" || b.p === "DST" || (a.t !== b.t && a.t !== b.o)) continue;
      if (a.t === b.t && a.p !== "QB" && b.p !== "QB") continue;
      const L = LIFT[(a.t === b.t ? "same" : "opp") + "|" + a.role + "|" + b.role]; if (!L || L <= 1.1) continue;
      syn.push({x, y, v: (L - 1) * a.w * b.w, L}); }
    syn.sort((p, q) => q.v - p.v);
    let h = '<h2>Before the games: strong pairs we skipped</h2><p class="note">Same-game pairs the 2018-22 lift table says boom together (QB stacks and bring-backs), ranked by lift × both boom chances. Red = on none of our tickets. No hindsight here. Click a row to see the tickets that hold it.</p><div class="tablewrap" style="max-height:34vh"><table><thead><tr><th>Pair</th><th class="num">Lift</th><th class="num">Ours</th></tr></thead><tbody>'
      + syn.slice(0, 30).map(r => { const c = pc.get(key(r.x, r.y)) || 0; return '<tr class="click" data-pi="' + r.x + '" data-pj="' + r.y + '"><td>' + chip(r.x, W) + " " + chip(r.y, W) + '</td><td class="num">' + r.L.toFixed(2) + '</td><td class="num' + (c === 0 ? " flag" : "") + '">' + c + "</td></tr>"; }).join("") + "</tbody></table></div>";
    if (!S.truth) { body.innerHTML = h + truthOnly; return; }
    const tc = new Map(), outC = new Map();
    for (const tl of W.post.top) { const ids = tl.ids; for (let x = 0; x < ids.length; x++) for (let y = x + 1; y < ids.length; y++) { const k2 = key(ids[x], ids[y]); tc.set(k2, (tc.get(k2) || 0) + 1); } for (const o of tl.out) outC.set(o, (outC.get(o) || 0) + 1); }
    const rows = [...tc].map(([k2, c]) => ({k2, c, ours: pc.get(k2) || 0})).sort((p, q) => q.c - p.c).slice(0, 40);
    h += '<h2 style="margin-top:12px">After the games: what the real top 100 paired</h2><p class="note">The pairs the real top 100 lineups used most, and how many of our tickets held them. Red = we never paired them.</p><div class="tablewrap" style="max-height:34vh"><table><thead><tr><th>Pair</th><th class="num">Top 100</th><th class="num">Ours</th></tr></thead><tbody>'
      + rows.map(r => { const [x, y] = r.k2.split("|").map(Number); return '<tr class="click" data-pi="' + x + '" data-pj="' + y + '"><td>' + chip(x, W) + " " + chip(y, W) + '</td><td class="num">' + r.c + '</td><td class="num' + (r.ours === 0 ? " flag" : "") + '">' + r.ours + "</td></tr>"; }).join("") + "</tbody></table></div>"
      + (outC.size ? '<p class="note"><b>Not in our pool at all</b> (used by the real top 100): ' + [...outC].sort((p, q) => q[1] - p[1]).slice(0, 14).map(([nm, c]) => esc(nm) + " " + c).join(", ") + "</p>" : "");
    body.innerHTML = h; return;
  }
}
// ---------- controls ----------
function renderAll(anim) { renderMain(anim); renderTab(); }
function renderKnobs() {
  $("knoblist").innerHTML = KNOBS.map(k => '<div class="knob"><label for="k-' + k.k + '">' + k.label + '</label><output id="o-' + k.k + '">' + S.knobs[k.k] + '</output><input type="range" id="k-' + k.k + '" min="' + k.min + '" max="' + k.max + '" step="' + k.step + '" value="' + S.knobs[k.k] + '"><small>' + k.help + "</small></div>").join("");
  for (const k of KNOBS) $("k-" + k.k).addEventListener("input", e => { S.knobs[k.k] = +e.target.value; $("o-" + k.k).textContent = e.target.value; scheduleRebuild(); });
  $("rulelist").innerHTML = RULES.map(r => '<label class="rule' + (S.knobs.rules[r.k] ? "" : " off") + '"><input type="checkbox" id="r-' + r.k + '"' + (S.knobs.rules[r.k] ? " checked" : "") + "><span>" + r.label + "</span><small>" + r.help + "</small></label>").join("");
  for (const r of RULES) $("r-" + r.k).addEventListener("change", e => { S.knobs.rules[r.k] = e.target.checked; e.target.closest(".rule").classList.toggle("off", !e.target.checked); scheduleRebuild(); });
}
let rebuildTimer = null;
function scheduleRebuild() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(() => { try { localStorage.setItem("comboLabKnobs", JSON.stringify(S.knobs)); } catch (e) {} stopPlay(); if (S.book !== "mine") setBook("mine"); S.shown = 150; renderAll(); }, 140); }
function setBook(b) { S.book = b; for (const x of $("books").children) x.setAttribute("aria-pressed", String(x.dataset.b === b)); }
function setTab(t) { S.tab = t; for (const x of $("tabs").children) x.setAttribute("aria-selected", String(x.dataset.t === t)); }
function setView(v) { S.view = v; for (const x of $("views").children) x.setAttribute("aria-selected", String(x.dataset.v === v)); }
$("weeks").innerHTML = LAB.weeks.map((w, k) => '<button data-w="' + k + '" aria-pressed="' + (k === S.week) + '">Week ' + w.week + "</button>").join("");
$("weeks").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; stopPlay(); S.week = +b.dataset.w; S.sel = null; S.filter = null; S.game = null; S.shown = 150; for (const x of $("weeks").children) x.setAttribute("aria-pressed", String(x === b)); renderAll(); });
$("books").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; stopPlay(); setBook(b.dataset.b); S.shown = 150; renderAll(); });
$("color").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.color = b.dataset.c; for (const x of $("color").children) x.setAttribute("aria-pressed", String(x === b)); renderAll(); });
$("truth").addEventListener("change", e => { S.truth = e.target.checked; renderAll(); });
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; setTab(b.dataset.t); renderTab(); });
$("views").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; setView(b.dataset.v); renderMain(); });
document.addEventListener("change", e => { if (e.target.id === "gamesel") { S.game = e.target.value; renderMain(); } });
document.addEventListener("click", e => {
  if (e.target.id === "clearf") { S.filter = null; renderAll(); return; }
  if (e.target.id === "onlysel" && S.sel !== null) { S.filter = {type: "player", i: S.sel}; setView("tickets"); renderMain(); return; }
  const c = e.target.closest(".chip");
  if (c) { const i = +c.dataset.i; S.sel = S.sel === i ? null : i; if (S.sel !== null) setTab("pairs"); renderAll(); return; }
  const cell = e.target.closest("td[data-q]");
  if (cell) { S.filter = {type: "cell", qi: +cell.dataset.q, a: cell.dataset.a, b: cell.dataset.b, own: cell.dataset.own === "1"}; setView("tickets"); renderMain(); return; }
  const pr = e.target.closest("[data-pi]");
  if (pr) { S.filter = {type: "pair", i: +pr.dataset.pi, j: +pr.dataset.pj}; setView("tickets"); renderMain(); return; }
  const gr = e.target.closest("tr[data-g]");
  if (gr) { S.game = gr.dataset.g; setView("matrix"); renderMain(); return; }
  const th = e.target.closest("th[data-s]");
  if (th) { S.sort = th.dataset.s; renderTab(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches && e.target.matches("td[data-q]")) e.target.click(); });
$("scrub").addEventListener("input", e => { stopPlay(); S.shown = +e.target.value; renderAll(); });
let playing = null;
function stopPlay() { if (playing) { clearInterval(playing); playing = null; $("play").textContent = "Play the fill"; } }
$("play").addEventListener("click", () => {
  if (playing) { stopPlay(); return; }
  S.shown = 0; renderAll(); $("play").textContent = "Pause";
  playing = setInterval(() => { const B = currentBook(); if (S.shown >= B.tickets.length) { stopPlay(); renderTab(); return; }
    S.shown++; renderMain(S.shown - 1); if (S.shown % 5 === 0 || S.shown === B.tickets.length) renderTab(); }, +$("speed").value);
});
$("reset").addEventListener("click", () => { S.knobs = defaultKnobs(); renderKnobs(); scheduleRebuild(); });
$("copyk").addEventListener("click", () => { const txt = JSON.stringify(S.knobs); const done = () => { $("copied").textContent = "Copied: " + txt; };
  try { navigator.clipboard.writeText(txt).then(done, () => { $("copied").textContent = txt; }); } catch (e) { $("copied").textContent = txt; } });
renderKnobs(); renderAll();
</script>
</body>
